name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix site --no-audit --no-fund

      # One command, the same one the hooks run. CI and local cannot drift.
      - run: scripts/task check

  # The single status check to require in branch protection. Adding a job above
  # means adding it to `needs` here, and nowhere else.
  required:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "a required job did not succeed"
            exit 1
          fi
