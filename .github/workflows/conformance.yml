name: conformance

on:
  push: { branches: [main] }
  pull_request:

jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci --prefix site

      # Fails if a literal appears outside the primitives layer, or if any
      # real foreground/background pairing drops below WCAG AA.
      - run: npm run check --prefix site

      - run: npm run build --prefix site
