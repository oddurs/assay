name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: scripts/task check

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes

      # Generated notes echo commit subjects; strip attribution if any slipped in.
      - name: Strip attribution from the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          cleaned=$(printf '%s' "$notes" | grep -viE 'co-authored-by:.*(claude|copilot|chatgpt|gpt|gemini|cursor|codex|anthropic|openai)|generated with|🤖' || true)
          if [ "$notes" != "$cleaned" ]; then
            printf '%s' "$cleaned" | gh release edit "${GITHUB_REF_NAME}" --notes-file -
            echo "stripped attribution from the release notes"
          fi
