# cairn.toml — the schema for this project's roadmap and issues.
#
# Everything here is configurable: the item types, the statuses they move
# through, any extra fields you want to track, the milestones, the saved views,
# and how ROADMAP.md gets rendered. Delete what you do not need.
#
#   cairn config          show the resolved schema
#   cairn check           validate every item against it
#   man cairn             full reference

# On-disk format version. cairn refuses to open a project written in a format it
# does not know, rather than misreading it. See "Compatibility" in the manual.
format = 1

[project]
name = "scaffold-family"
dir = "cairn/items"           # where item files live, relative to this file
id_width = 4              # 0001, 0002, ...
default_type = "feature"
default_status = "backlog"
# filename_max = 255      # longest filename your filesystem accepts, in bytes;
                          # titles are only shortened as much as this demands
# url = "https://github.com/stylegraphjs/stylegraph/blob/main"   # makes rendered items clickable

# ─── Item types ──────────────────────────────────────────────────────────────
# `template` seeds the body of new items of that type, so every bug report and
# every feature arrives with the same headings.

[[type]]
name = "feature"
icon = "+"
color = "cyan"
template = """
## Problem

## Proposal

## Acceptance criteria

- [ ]
"""

[[type]]
name = "bug"
icon = "!"
color = "red"
template = """
## What happens

## What should happen

## Reproduction

1.
"""

[[type]]
name = "chore"
icon = "~"
color = "gray"

[[type]]
name = "docs"
icon = "*"
color = "blue"

# ─── Statuses ────────────────────────────────────────────────────────────────
# Order matters: it is the column order on the board and the sort order in
# listings. `category` is what the tool reasons about — open / active / done /
# dropped — so you can rename the statuses themselves to anything you like.

[[status]]
name = "backlog"
category = "open"
color = "gray"

[[status]]
name = "planned"
category = "open"
color = "blue"

[[status]]
name = "doing"
label = "in progress"
category = "active"
color = "yellow"

[[status]]
name = "blocked"
category = "active"
color = "red"

[[status]]
name = "done"
category = "done"
color = "green"

[[status]]
name = "dropped"
category = "dropped"
color = "gray"
board = false             # hide this column on `cairn board`

# ─── Custom fields ───────────────────────────────────────────────────────────
# kind = text | enum | list | date | number | bool
# `column = true` puts the field in the default `cairn list` table.
# Enum values are ordered: `cairn list --sort priority` respects that order.

[[field]]
name = "priority"
kind = "enum"
values = ["p0", "p1", "p2", "p3"]
default = "p2"
column = true
description = "p0 is a release blocker"

[[field]]
name = "effort"
kind = "enum"
values = ["s", "m", "l", "xl"]
description = "Rough size, not an estimate"

[[field]]
name = "area"
kind = "text"
description = "Subsystem this touches"

# ─── Milestones ──────────────────────────────────────────────────────────────
# Sections of the rendered roadmap, in due-date order.

[[milestone]]
name = "v0.1"
title = "The format and the audit"
due = "2026-10-15"
description = "The graph is specified and one tool reads it well enough to run a real project's design system."

[[milestone]]
name = "v0.2"
title = "Into the token pipeline"
due = "2026-12-01"
description = "DTCG both directions. StyleX stops being outside the industry's token toolchain."

[[milestone]]
name = "v0.3"
title = "Authoring and verification"
due = "2027-02-01"
description = "Variants to write with, and tests that assert on tokens rather than on generated class names."

[[milestone]]
name = "v1.0"
title = "Stable"
due = "2027-04-01"
description = "The format is frozen at v1, every package is documented, and the whole family is safe to depend on."

[[milestone]]
name = "later"
title = "Someday"
description = "Good ideas without a date yet."
